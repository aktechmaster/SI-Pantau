<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Dashboard SI PANTAU</title>

    <style>

        /* Reset dasar */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }



        body {

            /* Latar belakang nuansa teknologi gelap */

            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            position: relative;

        }



        /* Elemen dekoratif latar belakang (lingkaran cahaya) */

        .circle {

            position: absolute;

            border-radius: 50%;

            background: linear-gradient(to right, #00c6ff, #0072ff);

            opacity: 0.4;

            filter: blur(80px);

            z-index: 0;

        }

        .c1 { width: 300px; height: 300px; top: 10%; left: 20%; }

        .c2 { width: 250px; height: 250px; bottom: 10%; right: 20%; background: linear-gradient(to right, #7f00ff, #e100ff); }



        /* Wadah Login (Efek Glassmorphism) */

        .login-container {

            background: rgba(255, 255, 255, 0.1);

            backdrop-filter: blur(15px);

            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 20px;

            padding: 40px;

            width: 400px;

            text-align: center;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);

            z-index: 1;

            color: #fff;

        }



        /* Wadah Logo Baru */

        .logo-container {

            margin: 0 auto 20px;

            text-align: center;

        }

        

        /* Gaya Gambar Logo */

        .logo-img {

            width: 80px;

            height: 80px;

            object-fit: contain; /* Menjaga proporsi gambar */

            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5)); /* Efek cahaya pada logo */

        }



        h2 {

            margin-bottom: 5px;

            font-weight: 600;

            letter-spacing: 1px;

        }

        

        p.subtitle {

            font-size: 0.9em;

            color: #ddd;

            margin-bottom: 30px;

        }



        /* Input Form */

        .input-group {

            position: relative;

            margin-bottom: 20px;

            text-align: left;

        }



        .input-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 0.9em;

            color: #b0c4de;

        }



        .input-group input {

            width: 100%;

            padding: 12px 15px;

            background: rgba(255, 255, 255, 0.05);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 8px;

            color: #fff;

            font-size: 1em;

            outline: none;

            transition: 0.3s;

        }



        .input-group input:focus {

            background: rgba(255, 255, 255, 0.1);

            border-color: #00c6ff;

            box-shadow: 0 0 10px rgba(0, 198, 255, 0.3);

        }



        /* Tombol Login */

        .btn-login {

            width: 100%;

            padding: 12px;

            background: linear-gradient(to right, #00c6ff, #0072ff);

            border: none;

            border-radius: 8px;

            color: #fff;

            font-size: 1em;

            font-weight: bold;

            cursor: pointer;

            transition: transform 0.2s, box-shadow 0.2s;

            margin-top: 10px;

        }



        .btn-login:hover {

            transform: translateY(-2px);

            box-shadow: 0 5px 15px rgba(0, 198, 255, 0.4);

        }



        /* Footer kecil */

        .footer {

            margin-top: 20px;

            font-size: 0.8em;

            color: rgba(255, 255, 255, 0.5);

        }

        

        /* Pesan Error */

        #error-msg {

            color: #ff6b6b;

            font-size: 0.9em;

            margin-top: 10px;

            display: none;

        }

    </style>

</head>

<body>



    <div class="circle c1"></div>

    <div class="circle c2"></div>



    <div class="login-container">

        <div class="logo-container">

            <img src="logosmpit.png" alt="Logo SMPIT" class="logo-img">

        </div>



        <h2>SI PANTAU</h2>

        <p class="subtitle">SIT Al-Kautsar Mukomuko</p>



        <form id="loginForm">

            <div class="input-group">

                <label for="username">Username</label>

                <input type="text" id="username" placeholder="Masukkan username" required>

            </div>

            

            <div class="input-group">

                <label for="password">Password</label>

                <input type="password" id="password" placeholder="Masukkan password" required>

            </div>



            <button type="submit" class="btn-login">MASUK PORTAL</button>

            <p id="error-msg">Username atau Password salah!</p>

        </form>



        <div class="footer">

            &copy; 2026 <span>aktechmaster</span> <br> Designed & Developed by aktechmaster

        </div>

    </div>

    <script>
        function toggleMenu() {
            document.getElementById('dropdownMenu').classList.toggle('active');
        }
        // Menutup dropdown jika klik di luar
        window.onclick = function(event) {
            if (!event.target.matches('.menu-toggle') && !event.target.matches('.fa-shapes')) {
                var dropdowns = document.getElementsByClassName("dropdown-menu");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('active')) {
                        openDropdown.classList.remove('active');
                    }
                }
            }
        }
    </script>
</body>
</html>

</html>

    <script>
        function toggleMenu() {
            document.getElementById('dropdownMenu').classList.toggle('active');
        }

        }

</html>

    <script>
        // Tanggal
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', dateOptions);

        // Menu Toggle
        function toggleMenu() { document.getElementById('dropdownMenu').classList.toggle('active'); }

        // Modal Logic
        function openModal(id) { 
            document.getElementById(id).classList.add('show'); 
            document.getElementById('dropdownMenu').classList.remove('active'); 
        }
        function closeModal(id) { document.getElementById(id).classList.remove('show'); }

        // --- LOGOUT KE PORTAL NYATA (INDEX.HTML) ---
        function logoutAction() {
            if(confirm('Apakah Anda yakin ingin keluar dari aplikasi?')) {
                window.location.href = 'index.html';
            }
        }

        function refreshData() {
            const icon = document.querySelector('.fa-sync-alt');
            icon.classList.add('fa-spin');
            setTimeout(() => { 
                icon.classList.remove('fa-spin'); 
                alert('Data berhasil diperbarui!');
            }, 1000);
        }

        async function savePasswordLogic() {
    const oldPass = document.getElementById('oldPass').value;
    const newPass = document.getElementById('newPass').value;
    const confPass = document.getElementById('confPass').value;
    
    // Ambil Nama Guru dari LocalStorage (diset saat login)
    const namaGuru = localStorage.getItem('namaGuru');

    // 1. Validasi Input Dasar
    if (!oldPass || !newPass || !confPass) {
        alert("Semua kolom harus diisi!");
        return;
    }
    if (newPass.length < 6) {
        alert("Password baru minimal 6 karakter!");
        return;
    }
    if (newPass !== confPass) {
        alert("Konfirmasi password tidak cocok!");
        return;
    }

    // 2. Visual Loading
    const btn = document.querySelector('#modalPassword .btn-cyan');
    const originalText = btn.innerText;
    btn.innerText = "Menghubungkan ke Database...";
    btn.disabled = true;

    try {
        // 3. Kirim data ke Google Apps Script (Fungsi doPost)
        // URL diambil dari SCRIPT_URL yang ada di index.html (pastikan didefinisikan kembali di sini)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxjOtLl18ZvhzJnvGYGBiOki7UmjjeinUdFecOtBVqYgY6BrgVvMXgZKHNRouSoJgA2ew/exec";
        
        // Gunakan URLSearchParams agar terbaca sebagai parameter oleh GS
        const formData = new URLSearchParams();
        formData.append('action', 'ubahPassword');
        formData.append('nama', namaGuru);
        formData.append('password', newPass);

        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // Penting untuk menghindari blokir CORS Google Apps Script
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        });

        // Karena mode 'no-cors', kita tidak bisa membaca isi JSON respons secara langsung, 
        // namun jika fetch berhasil sampai ke server, kita asumsikan sukses.
        alert('PERMINTAAN TERKIRIM: Password sedang diperbarui di database. Silakan login ulang nanti untuk memastikan.');
        
        // Reset dan Tutup
        document.getElementById('oldPass').value = '';
        document.getElementById('newPass').value = '';
        document.getElementById('confPass').value = '';
        closeModal('modalPassword');

    } catch (error) {
        console.error("Error ganti password:", error);
        alert("Gagal menghubungi server. Periksa koneksi internet Anda.");
    } finally {
        btn.innerText = originalText;
        btn.disabled = false;
    }
}

            // 3. Simulasi Proses Penyimpanan ke Server (Database)
            // Karena ini file HTML standalone, kita gunakan LocalStorage browser sebagai pengganti database.
            // Jika Anda punya Backend (PHP/NodeJS), bagian ini diganti dengan fetch() API.
            
            const btn = document.querySelector('#modalPassword .btn-cyan');
            const originalText = btn.innerText;
            btn.innerText = "Menyimpan...";
            btn.disabled = true;

            setTimeout(() => {
                // Simpan ke Browser Storage
                localStorage.setItem('user_password_kepsek', newPass);

                alert('SUKSES: Password berhasil diperbarui!');
                
                // Reset Form
                document.getElementById('oldPass').value = '';
                document.getElementById('newPass').value = '';
                document.getElementById('confPass').value = '';
                
                // Kembalikan Tombol & Tutup Modal
                btn.innerText = originalText;
                btn.disabled = false;
                closeModal('modalPassword');
            }, 1000); // Simulasi delay server 1 detik
        }

        // Close when clicking outside
        window.onclick = function(e) {
            if (e.target.classList.contains('modal')) e.target.classList.remove('show');
            if (!e.target.closest('.menu-container')) document.getElementById('dropdownMenu').classList.remove('active');
        }
    </script>
</body>
</html>
