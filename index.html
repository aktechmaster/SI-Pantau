<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Dashboard SI PANTAU</title>
    <style>
        /* Reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Latar belakang diubah menjadi lebih cerah dan lembut */
            background: linear-gradient(135deg, #e0f2f1 0%, #e3f2fd 50%, #f3e5f5 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Elemen dekoratif latar belakang (warna lebih cerah) */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            opacity: 0.3;
            filter: blur(60px);
            z-index: 0;
        }
        .c1 { width: 350px; height: 350px; top: -5%; left: 10%; }
        .c2 { width: 300px; height: 300px; bottom: 5%; right: 10%; background: linear-gradient(to right, #f093fb, #f5576c); }

        /* Wadah Login (Efek Glassmorphism Terang) */
        .login-container {
            background: rgba(255, 255, 255, 0.7); /* Lebih putih transparan */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            z-index: 1;
            color: #333; /* Teks diubah ke gelap agar terbaca */
        }

        /* Wadah Logo */
        .logo-container {
            margin: 0 auto 20px;
            text-align: center;
        }
        
        /* Gaya Gambar Logo */
        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.1));
        }

        h2 {
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #1a73e8; /* Warna biru cerah untuk judul */
        }
        
        p.subtitle {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 30px;
        }

        /* Input Form */
        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: #555;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            border-radius: 8px;
            color: #333;
            font-size: 1em;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            background: #fff;
            border-color: #4facfe;
            box-shadow: 0 0 8px rgba(79, 172, 254, 0.2);
        }

        /* Tombol Login (Biru Cerah) */
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #4facfe, #0072ff);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.2);
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.3);
            filter: brightness(1.1);
        }

        /* Footer */
        .footer {
            margin-top: 25px;
            font-size: 0.8em;
            color: #888;
        }
        
        /* Pesan Error */
        #error-msg {
            color: #e53935;
            font-size: 0.85em;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="circle c1"></div>
    <div class="circle c2"></div>

    <div class="login-container">
        <div class="logo-container">
            <img src="logosmpit.png" alt="Logo SMPIT" class="logo-img">
        </div>

        <h2>SI PANTAU</h2>
        <p class="subtitle">SIT Al-Kautsar Mukomuko</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="btn-login">MASUK PORTAL</button>
            <p id="error-msg">Username atau Password salah!</p>
        </form>

        <div class="footer">
            &copy; 2026 <span>aktechmaster</span> <br> Designed & Developed by aktechmaster
        </div>
    </div>

</body>
</html>

    <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4K4zFt99EquOI5tis0DrywRUrJxhAFxTHQJiwUaI0SESVKGPOW6Kwg5AzWxWKb5wt/exec"; 
    let databaseGuru = []; 
    const btnLogin = document.querySelector('.btn-login');

    window.onload = async function() {
        try {
            btnLogin.innerHTML = "Memuat Data...";
            btnLogin.disabled = true;
            btnLogin.style.opacity = "0.7";

            const response = await fetch(SCRIPT_URL);
            const data = await response.json();

            if (data.users) {
                databaseGuru = data.users; // Mengambil array dari result.users di Code.gs
                btnLogin.innerHTML = "MASUK PORTAL";
                btnLogin.disabled = false;
                btnLogin.style.opacity = "1";
            }
        } catch (error) {
            console.error("Gagal ambil data:", error);
            btnLogin.innerHTML = "Gagal Koneksi Server";
        }
    };

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        const inputUser = document.getElementById('username').value.trim();
        const inputPass = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');

        if (databaseGuru.length === 0) {
            alert("Data sedang dimuat, mohon tunggu...");
            return;
        }

        // Mencari user berdasarkan username dan password dari Kolom C dan D di Sheet
        const guruDitemukan = databaseGuru.find(g => 
            String(g.username).toLowerCase() === inputUser.toLowerCase() && 
            String(g.password) === String(inputPass)
        );

        if (guruDitemukan) {
            // Simpan data ke session/local storage
            localStorage.setItem('namaGuru', guruDitemukan.nama);
            localStorage.setItem('jabatan', guruDitemukan.jabatan);
            
            btnLogin.innerHTML = "Berhasil Masuk...";
            btnLogin.style.background = "linear-gradient(to right, #11998e, #38ef7d)";
            
            setTimeout(() => {
                // LOGIKA REDIRECT BERDASARKAN JABATAN (Kolom E)
                if (guruDitemukan.jabatan === "Kepala Sekolah") {
                    window.location.href = 'dashboardkepsek.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            }, 1000);

        } else {
            errorMsg.style.display = 'block';
            // Efek getar jika salah
            document.querySelector('.login-container').style.animation = "shake 0.5s";
            setTimeout(() => { document.querySelector('.login-container').style.animation = "none"; }, 500);
        }
    });
</script>

</body>

</html>
